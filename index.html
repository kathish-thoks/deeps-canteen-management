<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEEPS – Digital Efficient Easy Payment System | Billing</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-utensils"></i> DEEPS – Digital Efficient Easy Payment System</h1>
            <nav>
                <a href="index.html" class="active"><i class="fas fa-cash-register"></i> Billing</a>
                <a href="menu-manager.html"><i class="fas fa-bars"></i> Manage Menu</a>
                <a href="sales-report.html"><i class="fas fa-chart-line"></i> Sales Report</a>
            </nav>
        </header>

        <main>
            <div class="menu-section">
                <div class="menu-header">
                    <h2>Menu</h2>
                    <div class="category-filter">
                        <button class="filter-btn active" data-category="all">All</button>
                        <button class="filter-btn" data-category="Snacks">Snacks</button>
                        <button class="filter-btn" data-category="Rolls">Rolls</button>
                        <button class="filter-btn" data-category="Ice Creams">Ice Creams</button>
                        <button class="filter-btn" data-category="Beverages">Beverages</button>
                        <button class="filter-btn" data-category="Chips">Chips</button>
                        <button class="filter-btn" data-category="Breads">Breads</button>
                        <button class="filter-btn" data-category="Others">Others</button>
                    </div>
                </div>
                <div class="menu-grid" id="menuGrid">
                    <!-- Menu items will be dynamically loaded here -->
                </div>
            </div>

            <div class="cart-section">
                <div class="cart-header">
                    <h2><i class="fas fa-shopping-cart"></i> Cart</h2>
                    <button class="clear-cart-btn" id="clearCartBtn">
                        <i class="fas fa-trash"></i> Clear
                    </button>
                </div>
                <div class="cart-items" id="cartItems">
                    <div class="empty-cart">
                        <i class="fas fa-shopping-cart"></i>
                        <p>Your cart is empty</p>
                    </div>
                </div>
                <div class="cart-footer">
                    <div class="cart-total">
                        <span>Total: ₹<span id="cartTotal">0</span></span>
                    </div>
                    <div class="cart-actions">
                        <button class="btn btn-primary" id="payNowBtn">
                            <i class="fas fa-qrcode"></i> Pay Now
                        </button>
                        <button class="btn btn-secondary" id="printBillBtn">
                            <i class="fas fa-print"></i> Print Bill
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Pay Now Modal -->
    <div class="modal" id="payModal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <h2>Scan to Pay</h2>
            <div class="qr-code-container">
                <img id="upiQrCode" src="" alt="UPI QR Code">
            </div>
            <p>Scan the QR code to complete payment</p>
            <button class="btn btn-primary" id="confirmPaymentBtn">Payment Received</button>
        </div>
    </div>

    <script src="js/main.js"></script>
    
    <footer class="site-footer">
        <p>© 2025 DEEPS – Digital Efficient Easy Payment System | Smart Billing for Smart Students</p>
    </footer>
</body>
</html>
