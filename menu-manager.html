<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEEPS – Digital Efficient Easy Payment System | Manage Menu</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-utensils"></i> DEEPS – Digital Efficient Easy Payment System</h1>
            <nav>
                <a href="index.html"><i class="fas fa-cash-register"></i> Billing</a>
                <a href="menu-manager.html" class="active"><i class="fas fa-bars"></i> Manage Menu</a>
                <a href="sales-report.html"><i class="fas fa-chart-line"></i> Sales Report</a>
            </nav>
        </header>

        <main>
            <div class="menu-manager-header">
                <h2>Menu Management</h2>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-secondary" id="settingsBtn">
                        <i class="fas fa-cog"></i> Settings
                    </button>
                    <button class="btn btn-primary" id="addItemBtn">
                        <i class="fas fa-plus"></i> Add New Item
                    </button>
                </div>
            </div>

            <!-- Settings Modal -->
            <div class="modal" id="settingsModal">
                <div class="modal-content">
                    <span class="close" id="closeSettingsModal">&times;</span>
                    <h2>Settings</h2>
                    <form id="settingsForm">
                        <div class="form-group">
                            <label for="upiQrCode">UPI QR Code</label>
                            <input type="file" id="upiQrCode" accept="image/*">
                            <div class="image-preview" id="qrCodePreview"></div>
                            <small style="color: #666;">Upload your UPI QR code image</small>
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" id="cancelSettingsBtn">Cancel</button>
                            <button type="submit" class="btn btn-primary">Save Settings</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Add/Edit Item Modal -->
            <div class="modal" id="itemModal">
                <div class="modal-content modal-large">
                    <span class="close" id="closeItemModal">&times;</span>
                    <h2 id="modalTitle">Add New Item</h2>
                    <form id="itemForm">
                        <div class="form-group">
                            <label for="itemName">Item Name *</label>
                            <input type="text" id="itemName" required>
                        </div>
                        <div class="form-group">
                            <label for="itemCategory">Category *</label>
                            <select id="itemCategory" required>
                                <option value="">Select Category</option>
                                <option value="Snacks">Snacks</option>
                                <option value="Rolls">Rolls</option>
                                <option value="Ice Creams">Ice Creams</option>
                                <option value="Beverages">Beverages</option>
                                <option value="Chips">Chips</option>
                                <option value="Breads">Breads</option>
                                <option value="Others">Others</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="itemPrice">Price (₹) *</label>
                            <input type="number" id="itemPrice" min="0" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="itemImage">Item Image</label>
                            <input type="file" id="itemImage" accept="image/*">
                            <div class="image-preview" id="imagePreview"></div>
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                            <button type="submit" class="btn btn-primary">Save Item</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="menu-items-grid" id="menuItemsGrid">
                <!-- Menu items will be dynamically loaded here -->
            </div>
        </main>
    </div>

    <script src="js/menu-manager.js"></script>
    
    <footer class="site-footer">
        <p>© 2025 DEEPS – Digital Efficient Easy Payment System | Smart Billing for Smart Students</p>
    </footer>
</body>
</html>
